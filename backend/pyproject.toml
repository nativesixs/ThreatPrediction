[tool.poetry]
name = "threat-prediction-backend"
version = "0.1.0"
description = "Network Traffic Monitoring and Cyber Attack Prediction Backend"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.104.0"
uvicorn = {extras = ["standard"], version = "^0.24.0"}
pydantic = "^2.4.0"
pydantic-settings = "^2.0.0"
torch = "^2.1.0"
scikit-learn = "^1.3.0"
pandas = "^2.1.0"
numpy = "^1.26.0"
sqlalchemy = "^2.0.0"
aiosqlite = "^0.19.0"
scapy = "^2.5.0"
kagglehub = "^0.2.0"
python-multipart = "^0.0.6"
websockets = "^12.0"
matplotlib = "^3.8.0"
seaborn = "^0.13.0"
imbalanced-learn = "^0.14.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.21.0"
black = "^23.10.0"
ruff = "^0.1.0"
mypy = "^1.6.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
download-dataset = "app.ml.dataset_downloader:download_all_datasets"
explore-dataset = "app.ml.dataset_explorer:explore_all_datasets"
process-features = "scripts.process_features:main"
train-model = "scripts.train_models:main"
evaluate-model = "scripts.evaluate_models:main"
backend-dev = "app.main:run_dev"
backend-prod = "app.main:run_prod"
capture-traffic = "scripts.capture_traffic:main"

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
